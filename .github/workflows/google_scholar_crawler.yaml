name: Get Citation Data

on:
  page_build:
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Update citation data
      run: |
        cd ./google_scholar_crawler
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python main.py
        cd ./results
        git init -b google-scholar-stats
        git config --local user.name "github-actions[bot]"
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add *.json
        git commit -m "Updated Citation Data"
        git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:google-scholar-stats --force
      env: 
        GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
        SCHOLAR_SCRAPERAPI_KEY: ${{ secrets.SCHOLAR_SCRAPERAPI_KEY }}
