work:
  - organization: "快手科技"
    url: https://www.kuaishou.com/
    location: 北京
    positions:
      - position: "#strong[Kstar] 研究实习生"
        startDate: 2025-08-01
        endDate: 2026-03-31
        highlights:
          - 从零搭建多智能体框架 (CVE-Factory)，用于规模化构建代码安全终端环境。实现了收集、构建、测试和评估的全流程自动化，无需人工干预。
          - 与专家人工复现交叉验证，一致率超过95%。支持异步并行，单机20并行在5小时内可生成215个任务（专家需10小时/任务）。
          - 扩展至4k+高质量漏洞修复任务。微调后的Qwen3-32B性能提升5倍，可比肩Minimax-M2.7和Claude Sonnet 4。在TerminalBench和跨语言场景中展现出强泛化能力。

  - organization: "阶跃星辰"
    url: https://www.stepfun.com/
    location: 北京
    positions:
      - position: 预训练研究实习生
        startDate: 2024-12-09
        endDate: 2025-07-31
        highlights:
          - 从零开发并清洗全量GitHub文件和Issue数据。进一步优化过滤规则以去除乱码文本，显著减少loss spike。
          - 在代码数据上进行了FIM、Meta Info、MTP和Focal Loss策略的实验。
          - 探索并验证了代码的Scaling Law。在特定约束下，预测误差低于0.1%。
          - 发现了代码压缩率与下游代码任务性能之间的对数关系。

  - organization: "度小满（北京）科技有限公司"
    url: https://github.com/Duxiaoman-DI
    location: 北京
    positions:
      - position: 产学研合作研究员
        startDate: 2023-11-01
        endDate: 2024-09-30
        highlights:
          - 从正确性和细节敏感性的角度合成代码SFT数据，在小模型上达到SOTA。
          - 利用多编程语言辅助推理，在多个基准和模型上取得一致提升。
          - 仅需2MB额外存储即可实现2倍无损加速，利用LLM解码的词表分布特征，超越此前的免训练推测解码方法30%以上。

