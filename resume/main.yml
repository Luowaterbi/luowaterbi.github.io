  - name: "Turning Trash into Treasure: Accelerating Inference of Large Language Models with Token Recycling"
    publisher: ACL 2025 [Outstanding Paper]
    releaseDate: 
    url: https://arxiv.org/abs/2408.08696
    authors:
      - "*Xianzhen Luo*"
      - Yixuan Wang
      - Qingfu Zhu
      - Zhiming Zhang
      - Xuanyu Zhang
      - Qing Yang
      - Dongliang Xu
    highlights:
      # - Token Recycling is a train-free speculative decoding method that leverages trash token—candidate tokens naturally generated and discarded during AR decoding as draft tokens to accelerate LLMs.
      # - With less than 2MB of additional storage, Token Recycling achieves approximately 2x speedup on all sizes of LLMs. It improves more than 31% compared to previous train-free approaches.

  - name: "ChartCoder: Advancing Multimodal Large Language Model for Chart-to-Code Generation"
    publisher: ACL 2025
    releaseDate: 
    url: https://arxiv.org/abs/2501.06598
    authors:
      - "Xuanle Zhao#super[$*$]"
      - "*Xianzhen Luo#super[$*$]*"
      - Qi Shi
      - Chi Chen
      - Shuo Wang
      - Wanxiang Che
      - Zhiyuan Liu
      - Maosong Sun
    highlights:
      # - ChartCoder is the first to leverage Code LLMs as the language backbones of MLLM. With only 7B parameters, it outperforms existing open-source MLLMs on chart-to-code benchmarks.
      # - Chart2Code-160k is the first large-scale and diverse chart-to-code dataset, consisting of 160k chart-code pairs across 27 chart types.

