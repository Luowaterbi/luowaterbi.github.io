  - name: "Advancing Tool-Augmented Large Language Models via Meta-Verification and Reflection Learning"
    publisher: KDD 2025
    releaseDate: 
    url: https://arxiv.org/abs/2506.04625
    authors:
      - Zhiyuan Ma
      - Jiayu Liu
      - "*Xianzhen Luo*"
      - Zhenya Huang
      - Qingfu Zhu
      - Wanxiang Che
    highlights:
      # - Introducing Multi-Agent Meta-Verification to systematically create high-quality, verified instruction datasets, which directly addresses unreliable tool planning and invocation caused by low-quality and hallucinated data.   
      # - Proposing Exploration-based Reflection Learning, a dynamic "Error → Reflection → Correction" paradigm that enables LLMs to dynamically learn from mistakes and improve reflection abilities.
  
  - name: "Python is Not Always the Best Choice: Embracing Multilingual Program of Thoughts"
    publisher: EMNLP 2024
    releaseDate: 
    url: https://arxiv.org/abs/2402.10691
    authors:
      - "*Xianzhen Luo*"
      - Qingfu Zhu
      - Zhiming Zhang
      - Libo Qin
      - Xuanyu Zhang
      - Qing Yang
      - Dongliang Xu
      - Wanxiang Che
    highlights:
      # - Current PoT research focuses exclusively on Python. We conduct comprehensive experiments across multiple programming languages (PLs), revealing that Python is not always the best choice for PoT.
      # - MultiPoT is a task and model agnostic approach, which integrates the strengths and diversity of multiple PLs. MultiPoT outperforms Python Self-Consistency and matches or surpasses the best-performing language in each scenario.
      
  - name: "Make Some Noise: Unlocking Language Model Parallel Inference Capability through Noisy Training"
    publisher: EMNLP 2024
    releaseDate: 
    url: https://aclanthology.org/2024.emnlp-main.718/
    authors:
      - "Yixuan Wang#super[$*$]"
      - "*Xianzhen Luo#super[$*$]*"
      - Fuxuan Wei
      - Yijun Liu
      - Qingfu Zhu
      - Xuanyu Zhang
      - Qing Yang
      - Dongliang Xu
      - Wanxiang Che
    highlights:
      # - Make Some Noise (MSN) is a new training framework as an alternative to SFT, which can unlock the parallel decoding capability of the model through the denoising task.
      # - MSN enables LLMs to have a comparable acceleration ratio to the SOTA method with minimal loss of task performance.

  - name: "A Survey on Natural Language Processing for Programming"
    publisher: COLING 2024
    releaseDate: 
    url: https://aclanthology.org/2024.lrec-main.149/
    authors:
      - Qingfu Zhu  
      - "*Xianzhen Luo*"
      - Fang Liu
      - Cuiyun Gao
      - Wanxiang Che
    highlights:
      # - "Two properties of PL are identified: structure-based and functionality-oriented, which are essential for program understanding and generation, respectively."
      # - From the perspective of the properties, we systematically review current work, covering tasks, datasets, evaluation methods, techniques, and representative models.
  
  - name: "Inverse is Better! Fast and Accurate Prompt for Few-shot Slot Tagging"
    publisher: ACL 2022 (Findings)
    releaseDate: 
    url: https://aclanthology.org/2022.findings-acl.53/
    authors:
      - Yutai Hou
      - Cheng Chen
      - "*Xianzhen Luo*"
      - Bohan Li
      - Wanxiang Che.
    highlights:
      # - We introduce the idea of inverse prediction to prompting methods for slot-tagging tasks and propose an Iterative Prediction Strategy which allows the model to consider dependency between different slot types and refine prediction.
      # - The proposed method brings significant improvements not only in speed but also in accuracy.
      
  - name: "Augmented and challenging datasets with multi-step reasoning and multi-span questions for Chinese judicial reading comprehension"
    publisher: AI Open 2022
    releaseDate: 
    url: https://www.sciencedirect.com/science/article/pii/S2666651022000225
    authors:
       - Qingye Meng
       - Ziyue Wang
       - Hang Chen
       - "*Xianzhen Luo*"
       - Baoxin Wang
       - Zhipeng Chen
       - Yiming Cui
       - Dayong Wu
       - Zhigang Chen
       - Shijin Wang
    highlights:
      # - Introduced two advanced datasets, CJRC2.0 and CJRC3.0, derived from Chinese judicial documents, featuring multi-step reasoning and more challenging questions compared to CJRC.
      # - CJRC3.0 includes a novel multi-span question type, requiring answers to be derived by extracting and combining multiple spans, advancing explainable legal machine reading comprehension.

