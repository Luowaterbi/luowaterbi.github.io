projects:
  - name: 'CVE-Factory: Scaling Expert-Level Agentic Tasks for Code Security Vulnerability'
    url: https://github.com/livecvebench/CVE-Factory
    affiliation: Kuaishou Technology
    startDate: 2025-10-01
    endDate: Present
    highlights:
      - A fully automated framework for reproducing CVE vulnerabilities, achieving 95% alignment rate with reproduction from code security experts.
